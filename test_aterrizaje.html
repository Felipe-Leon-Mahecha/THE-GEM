<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Test aterrizaje rueda</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #111;
            color: #eee;
            font-family: monospace;
            padding: 20px;
        }

        .scene {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }

        canvas {
            border-radius: 50%;
        }

        .pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 11px solid transparent;
            border-right: 11px solid transparent;
            border-top: 19px solid red;
            z-index: 10;
        }

        .log {
            max-width: 700px;
            margin: 10px auto;
            font-size: 13px;
            line-height: 1.8;
        }

        button {
            padding: 10px 20px;
            margin: 8px;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="log" id="log">Cargando...</div>
    <div class="scene" id="scene">
        <div class="pointer"></div>
        <canvas id="wheel" width="300" height="300"></canvas>
    </div>
    <button onclick="testSpin(0)">Forzar segmento 0</button>
    <button onclick="testSpin(1)">Forzar segmento 1</button>
    <button onclick="testSpin(2)">Forzar segmento 2</button>
    <button onclick="testSpin(3)">Forzar segmento 3</button>
    <button onclick="testSpin(4)">Forzar segmento 4</button>
    <button onclick="testSpin(5)">Forzar segmento 5</button>
    <button onclick="testSpin(6)">Forzar segmento 6</button>
    <button onclick="testSpin(7)">Forzar segmento 7</button>
    <button onclick="resetWheel()">Reset a 0°</button>

    <script>
        const N = 8;
        const COLORS = ['#3D6EE8', '#C03FD8', '#3D6EE8', '#C03FD8', '#3D6EE8', '#C03FD8', '#3D6EE8', '#C03FD8'];
        const LABELS = ['Seg 0', 'Seg 1', 'Seg 2', 'Seg 3', 'Seg 4', 'Seg 5', 'Seg 6', 'Seg 7'];

        function drawWheel(canvas, rotDeg) {
            const ctx = canvas.getContext('2d');
            const W = 300, cx = 150, cy = 150, R = 148;
            const segRad = (2 * Math.PI) / N;
            const startOffset = -Math.PI / 2;   // seg 0 borde en -90°

            ctx.clearRect(0, 0, W, W);
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(rotDeg * Math.PI / 180);  // rotación CSS = sentido horario
            ctx.translate(-cx, -cy);

            // Gajos
            for (let i = 0; i < N; i++) {
                const a0 = startOffset + segRad * i;
                const a1 = a0 + segRad;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, R, a0, a1);
                ctx.closePath();
                ctx.fillStyle = COLORS[i];
                ctx.fill();
                ctx.strokeStyle = '#111';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Número de segmento en el bisector
                const bisRad = startOffset + segRad * i + segRad / 2;
                const tx = cx + R * 0.6 * Math.cos(bisRad);
                const ty = cy + R * 0.6 * Math.sin(bisRad);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 18px monospace';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(i, tx, ty);
            }

            // Hub
            ctx.beginPath();
            ctx.arc(cx, cy, R * 0.12, 0, 2 * Math.PI);
            ctx.fillStyle = '#111';
            ctx.fill();
            ctx.strokeStyle = '#888';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.restore();
        }

        let currentRotation = 0;
        const canvas = document.getElementById('wheel');
        drawWheel(canvas, 0);

        function log(msg) {
            document.getElementById('log').innerHTML = msg;
        }

        function resetWheel() {
            currentRotation = 0;
            canvas.dataset.rotation = '0';
            drawWheel(canvas, 0);
            canvas.style.transform = '';
            log('Rueda reseteada a 0°. El segmento 0 debería estar con su borde en arriba (puntero entre seg 7 y seg 0).');
        }

        function testSpin(targetIndex) {
            const segDeg = 360 / N;

            // MISMA fórmula que performRouletteSpin en shop.js:
            const bisectorDeg = -90 + segDeg * targetIndex + segDeg / 2;
            const desiredModA = (((-bisectorDeg - 90) % 360) + 360) % 360;

            const prevRotation = parseFloat(canvas.dataset.rotation || '0');
            const currentMod = ((prevRotation % 360) + 360) % 360;
            const diff = (desiredModA - currentMod + 360) % 360;
            const next = prevRotation + 3 * 360 + diff;  // 3 vueltas para test rápido
            canvas.dataset.rotation = String(next);

            // Animación inmediata para el test
            canvas.style.transition = 'transform 1.5s ease-out';
            canvas.style.transform = `rotate(${next}deg)`;

            log(`Segmento objetivo: <b>${targetIndex}</b><br>
bisectorDeg = -90 + ${segDeg}*${targetIndex} + ${segDeg / 2} = <b>${bisectorDeg}°</b><br>
desiredMod = <b>${desiredModA.toFixed(2)}°</b><br>
nextRotation = <b>${next.toFixed(2)}°</b><br>
<br>
¿El puntero ▼ apunta al número <b>${targetIndex}</b>?`);
        }
    </script>
</body>

</html>
